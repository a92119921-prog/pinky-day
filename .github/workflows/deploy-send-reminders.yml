name: Deploy Pinky Day reminder function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/send-reminders/**"
      - ".github/workflows/deploy-send-reminders.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy send-reminders
        run: supabase functions deploy send-reminders --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ooewtyextgehtpmedwta
